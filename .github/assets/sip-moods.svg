lebrate"><g transform="translate(575 100)"><defs><linearGradient id="m3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ddd6fe"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><ellipse cx="38" cy="104" rx="8" ry="4.5" fill="#6d28d9"/><ellipse cx="62" cy="104" rx="8" ry="4.5" fill="#6d28d9"/><path d="M50 4 C62 22 86 42 86 68 C86 90 70 104 50 104 C30 104 14 90 14 68 C14 42 38 22 50 4 Z" fill="url(#m3)" stroke="#6d28d9" stroke-width="2"/><ellipse cx="34" cy="40" rx="6" ry="9" fill="#fff" opacity="0.55" transform="rotate(25 34 40)"/><circle cx="28" cy="76" r="5" fill="#fb7185" opacity="0.35"/><circle cx="72" cy="76" r="5" fill="#fb7185" opacity="0.35"/><g stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" fill="none"><path d="M32 67 q6 -8 12 0"/><path d="M56 67 q6 -8 12 0"/></g><path d="M42 78 q8 10 16 0 Z" fill="#7f1d1d"/></g></g><text x="625" y="252" text-anchor="middle" font-size="20" font-weight="700" fill="#F7F9FC">Celebrate</text><text x="625" y="276" text-anchor="middle" font-size="14" fill="#8A96A8">goal reached 🎉</text><rect x="760" y="10" width="230" height="280" rx="20" fill="#0E1521" stroke="#1f2b3d"/><ellipse cx="875" cy="216" rx="42" ry="7" fill="#000" opacity="0.35"/><g class="sleep"><g transform="translate(825 100)"><defs><linearGradient id="m4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fed7aa"/><stop offset="1" stop-color="#fb923c"/></linearGradient></defs><ellipse cx="38" cy="104" rx="8" ry="4.5" fill="#c2410c"/><ellipse cx="62" cy="104" rx="8" ry="4.5" fill="#c2410c"/><path d="M50 4 C62 22 86 42 86 68 C86 90 70 104 50 104 C30 104 14 90 14 68 C14 42 38 22 50 4 Z" fill="url(#m4)" stroke="#c2410c" stroke-width="2"/><ellipse cx="34" cy="40" rx="6" ry="9" fill="#fff" opacity="0.55" transform="rotate(25 34 40)"/><circle cx="28" cy="76" r="5" fill="#fb7185" opacity="0.35"/><circle cx="72" cy="76" r="5" fill="#fb7185" opacity="0.35"/><g stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"><path d="M32 66 q6 5 12 0"/><path d="M56 66 q6 5 12 0"/></g><path d="M46 80 q4 2 8 0" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/><g class="zzz" fill="#c2410c" font-weight="700"><text x="78" y="20" font-size="14">Z</text><text x="90" y="6" font-size="11">z</text><text x="99" y="-6" font-size="8">z</text></g></g></g><text x="875" y="252" text-anchor="middle" font-size="20" font-weight="700" fill="#F7F9FC">Sleepy</text><text x="875" y="276" text-anchor="middle" font-size="14" fill="#8A96A8">quiet hours 💤</text>
